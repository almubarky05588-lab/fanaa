name: fenaa
description: فناء — سوق المشاتل والمزارع
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # الحالة والتنقّل
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.0

  # الباك-إند والتخزين المحلي
  supabase_flutter: ^2.8.0
  shared_preferences: ^2.3.3

  # الواجهة
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  pin_code_fields: ^8.0.1
  qr_flutter: ^4.1.0
  shimmer: ^3.0.0

  # الخريطة والموقع
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.1
  geocoding: ^3.0.0

  # أدوات
  intl: ^0.20.3
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  share_plus: ^10.1.2

  # الدفع (صفحة ماي فاتورة داخل التطبيق)
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  ios: true
  android: false
  image_path: assets/brand/app_icon.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
