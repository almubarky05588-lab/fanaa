<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>فناء — الدفع</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F4F3EE;
  font-family:Cairo,system-ui,sans-serif;color:#0B2E20;padding:24px;text-align:center}
  .card{max-width:360px;background:#fff;border-radius:28px;padding:32px 24px;box-shadow:0 12px 28px rgba(11,46,32,.08)}
  h1{font-size:22px;margin:0 0 8px}p{margin:0;color:#5d6b63;line-height:1.7}
</style>
</head>
<body>
<div class="card">
  <h1 id="t">ارجع لتطبيق فناء</h1>
  <p>حالة طلبك تتحدّث تلقائيًا داخل التطبيق.</p>
</div>
<script>
  if (location.pathname.indexOf('/pay/done') === 0) document.getElementById('t').textContent = 'تم استلام الدفع — ارجع لتطبيق فناء';
  if (location.pathname.indexOf('/pay/failed') === 0) document.getElementById('t').textContent = 'لم يكتمل الدفع — ارجع لتطبيق فناء';
</script>
</body>
</html>
